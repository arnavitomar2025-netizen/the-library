<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Library</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almendra:ital,wght@0,400;0,700;1,400;1,700&family=Quintessential&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="stylee.css">
</head>


<body>

    <div class="background"></div>


    <div class="container">


        <!-- ACCOUNT LOGIN / SIGN UP -->

        <div class="account-card" id="accountCard">

            <h1>Welcome to The Library</h1>

            <p class="account-subtitle">
                Create your own little library of letters and memories.
            </p>


            <input type="email" id="email" placeholder="Your email">


            <div class="password-wrapper">
                <input type="password" id="accountPassword" placeholder="Create a password">

                <button type="button" class="toggle-password" data-target="accountPassword">
                    👁
                </button>
            </div>


            <button id="signUpBtn">
                Create My Library
            </button>


            <button id="loginBtn">
                I already have an account
            </button>


            <p id="authMessage"></p>

        </div>



        <!-- CREATE LIBRARY PASSWORD -->

        <div class="create-password-card hidden" id="createPasswordCard">

            <h1>Your Library Password</h1>

            <p class="question">
                Create a password for your private Library.
            </p>


            <div class="password-wrapper">
                <input type="password" id="newLibraryPassword" placeholder="Create Library password">

                <button type="button" class="toggle-password" data-target="newLibraryPassword">
                    👁
                </button>
            </div>


            <div class="password-wrapper">
                <input type="password" id="confirmLibraryPassword" placeholder="Confirm Library password">

                <button type="button" class="toggle-password" data-target="confirmLibraryPassword">
                    👁
                </button>
            </div>


            <button id="saveLibraryPassword">
                Create My Library Password
            </button>


            <p id="createPasswordMessage"></p>

        </div>



        <!-- ENTER LIBRARY PASSWORD -->

        <div class="password-card hidden" id="passwordCard">

            <h1>The Library</h1>

            <p class="question">
                Enter your Library password:
            </p>


            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Enter Password">

                <button type="button" class="toggle-password" data-target="password">
                    👁
                </button>
            </div>


            <button id="unlockBtn">
                Unlock
            </button>


            <p id="errorMessage"></p>

        </div>



        <!-- WELCOME NOTE -->

        <div class="welcome-note hidden">

            <div class="paper">

                <p>
                    I have a lot to tell you, so I wrote this for you.
                </p>


                <button id="enterLibrary">
                    Enter the Library 📚
                </button>

            </div>

        </div>


    </div>



    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- YOUR JAVASCRIPT -->

    <script src="scriptt.js"></script>


</body>

</html>
